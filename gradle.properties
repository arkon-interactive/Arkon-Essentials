# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=0.29.0
maven_group=com.maxazarcon
archives_base_name=arkonessentials

# Dependencies
fabric_api_version=0.155.2+26.2

# Optional, compile-only: the Mod Menu config screen. Neither the server nor a client without Mod Menu
# ever loads the classes that touch it.
modmenu_version=20.0.1

# Optional, compile-only: web-map integrations. Only the small API artifacts, not the maps themselves.
# Neither mod is required at runtime — the integration checks isModLoaded first.
bluemap_api_version=2.7.2
squaremap_api_version=1.3.15
